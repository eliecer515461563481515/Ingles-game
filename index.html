<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Dispara la respuesta</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    background:#080a12;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    color:white;
}

body{

    display:flex;

    justify-content:center;
}

.app{

    width:100%;

    max-width:700px;

    min-height:100vh;

    padding:10px 8px 16px;
}


/* =====================================================
   BARRA SUPERIOR
===================================================== */

.topbar{

    height:68px;

    border:1px solid #2b467b;

    border-radius:22px;

    background:rgba(14,27,60,.96);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:8px 12px;

    margin-bottom:14px;

    box-shadow:0 8px 24px #0008;

    position:relative;

    z-index:100;
}

.iconbtn{

    width:52px;
    height:52px;

    border-radius:17px;

    border:1px solid #2e4b82;

    background:#101f45;

    color:white;

    font-size:28px;

    font-weight:bold;

    display:flex;

    align-items:center;

    justify-content:center;
}

.title{

    font-size:20px;

    font-weight:800;

    text-align:center;
}


/* =====================================================
   ÁREA DEL JUEGO
===================================================== */

.game{

    position:relative;

    width:100%;

    height:calc(100vh - 96px);

    min-height:650px;

    overflow:hidden;

    border-radius:28px;

    background:#090d2b;

    border:1px solid #10183b;

    box-shadow:0 12px 35px #0009;
}


/* =====================================================
   VIDEO
===================================================== */

.bg{

    position:absolute;

    inset:0;

    overflow:hidden;

    z-index:0;
}

.bg video{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:center bottom;

    display:block;
}

.bgShade{

    position:absolute;

    inset:0;

    background:rgba(3,7,28,.08);

    pointer-events:none;
}


/* =====================================================
   INTERFAZ
===================================================== */

.ui{

    position:absolute;

    inset:0;

    z-index:5;

    pointer-events:none;
}


/* =====================================================
   MARCADOR
===================================================== */

.status{

    position:absolute;

    top:20px;

    left:12px;

    right:12px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    z-index:30;
}

.pill{

    background:rgba(7,17,48,.82);

    border:1px solid #2b447a;

    border-radius:22px;

    padding:8px 13px;

    font-size:17px;

    font-weight:800;

    backdrop-filter:blur(6px);

    white-space:nowrap;
}


/* =====================================================
   PALABRA EN ESPAÑOL
===================================================== */

.target{

    position:absolute;

    top:100px;

    left:50%;

    transform:translateX(-50%);

    min-width:190px;

    max-width:82%;

    padding:12px 18px;

    border-radius:28px;

    background:rgba(8,19,52,.88);

    border:1px solid #31497a;

    box-shadow:0 0 25px #172f70aa;

    font-size:27px;

    font-weight:800;

    text-align:center;

    backdrop-filter:blur(7px);

    z-index:40;

    pointer-events:none;

    white-space:nowrap;
}


/* =====================================================
   ZONA DE MOVIMIENTO

   Esta es la "caja invisible"
   donde pueden moverse las burbujas.

   Tiene límites internos:
   arriba  = debajo de la palabra
   abajo   = antes del tanque
   izquierda/derecha = margen interno
===================================================== */

.answers{

    position:absolute;

    left:22px;

    right:22px;

    top:205px;

    bottom:245px;

    z-index:20;

    overflow:hidden;

    pointer-events:none;

    /*
       La zona queda encerrada
       dentro de estos límites.
    */
}


/* =====================================================
   BURBUJAS
===================================================== */

.answer{

    position:absolute;

    width:74px;

    height:74px;

    margin:0;

    padding:6px;

    border-radius:50%;

    border:1px solid #79adff;

    background:
    radial-gradient(
        circle at 30% 25%,
        #76adff,
        #3475df 55%,
        #174db6
    );

    color:white;

    font-size:13px;

    font-weight:800;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    box-shadow:

    0 0 18px #1871ff99,

    inset 0 2px 5px #ffffff55;

    cursor:pointer;

    pointer-events:auto;

    transform:
    translate(-50%,-50%);

    user-select:none;

    -webkit-tap-highlight-color:transparent;

    will-change:left,top,transform;

    z-index:25;
}


.answer:active{

    transform:
    translate(-50%,-50%)
    scale(.92);
}


/* =====================================================
   CORRECTA
===================================================== */

.answer.correct{

    background:
    radial-gradient(
        circle at 30% 25%,
        #65ff9a,
        #16c957 55%,
        #087c35
    );

    border-color:#8affb2;

    box-shadow:
    0 0 28px #00ff66;
}


/* =====================================================
   INCORRECTA
===================================================== */

.answer.wrong{

    background:
    radial-gradient(
        circle at 30% 25%,
        #ff7777,
        #e52e43 55%,
        #8e1020
    );

    border-color:#ffaaaa;

    box-shadow:
    0 0 28px #ff1e3c;
}


/* =====================================================
   PROYECTIL
===================================================== */

.projectile{

    position:absolute;

    width:13px;

    height:30px;

    border-radius:50%;

    background:
    linear-gradient(
        to bottom,
        #ffffff,
        #00eaff,
        #087bff
    );

    box-shadow:

    0 0 8px #ffffff,

    0 0 18px #00eaff,

    0 0 35px #008cff;

    z-index:60;

    pointer-events:none;

    transform:
    translate(-50%,-50%);

    transition:

    left .45s cubic-bezier(.25,.8,.3,1),

    top .45s cubic-bezier(.25,.8,.3,1);
}


/* =====================================================
   EXPLOSIÓN
===================================================== */

.explosion{

    position:absolute;

    width:25px;

    height:25px;

    border-radius:50%;

    background:#ffffff;

    box-shadow:

    0 0 10px #fff,

    0 0 25px #00eaff,

    0 0 45px #008cff;

    z-index:70;

    pointer-events:none;

    animation:
    boom .35s ease-out forwards;
}

@keyframes boom{

    0%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        scale(.3);
    }

    100%{

        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(3);
    }
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:430px){

    .app{

        padding:
        10px 8px 15px;
    }

    .title{

        font-size:18px;
    }

    .game{

        height:
        calc(100vh - 96px);

        min-height:650px;
    }

    .target{

        top:98px;

        font-size:25px;

        min-width:180px;
    }

    .answers{

        /*
           Barreras laterales.
        */

        left:20px;

        right:20px;

        /*
           Barrera superior.
        */

        top:195px;

        /*
           Barrera inferior.
           No llega hasta el tanque.
        */

        bottom:230px;
    }

    .answer{

        width:74px;

        height:74px;

        font-size:13px;
    }

    .pill{

        font-size:16px;

        padding:
        8px 12px;
    }

}


/* =====================================================
   PANTALLAS PEQUEÑAS
===================================================== */

@media(max-height:700px){

    .answers{

        top:185px;

        bottom:220px;
    }

    .target{

        top:90px;

        font-size:23px;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- =================================================
     BARRA SUPERIOR
================================================= -->

<header class="topbar">


<button
class="iconbtn"
id="backButton">

‹

</button>


<div class="title">

🚀 Dispara la respuesta

</div>


<button
class="iconbtn"
id="pause">

Ⅱ

</button>


</header>



<!-- =================================================
     JUEGO
================================================= -->

<main class="game">


<!-- =================================================
     VIDEO
================================================= -->

<div class="bg">


<video

id="backgroundVideo"

autoplay

muted

playsinline

loop

preload="auto"

src="tmp996ypisb.mp4">

</video>


<div class="bgShade"></div>


</div>



<!-- =================================================
     INTERFAZ
================================================= -->

<section class="ui">


<!-- MARCADOR -->

<div class="status">


<div class="pill">

✅
<span id="score">0</span>

❌
<span id="errors">0</span>

</div>


<div class="pill">

⏱
<span id="time">02:29</span>

</div>


</div>



<!-- PALABRA -->

<div class="target">

<span id="target">
dinero
</span>

🔊

</div>



<!-- BURBUJAS -->

<div
class="answers"
id="answers">
</div>


</section>



<!-- =================================================
     PROYECTIL
================================================= -->

<div
id="projectile"
class="projectile"
style="display:none;">
</div>


</main>


</div>



<script>


/* =====================================================
   PALABRAS
===================================================== */

const rounds = [

{

    es:"dinero",

    en:"money",

    opts:[
        "money",
        "noodles",
        "mop",
        "ice cream",
        "rice"
    ]

},

{

    es:"casa",

    en:"house",

    opts:[
        "house",
        "school",
        "window",
        "table",
        "car"
    ]

},

{

    es:"ventana",

    en:"window",

    opts:[
        "window",
        "door",
        "chair",
        "money",
        "house"
    ]

},

{

    es:"escuela",

    en:"school",

    opts:[
        "school",
        "table",
        "car",
        "house",
        "rice"
    ]

},

{

    es:"mesa",

    en:"table",

    opts:[
        "table",
        "window",
        "car",
        "school",
        "house"
    ]

},

{

    es:"carro",

    en:"car",

    opts:[
        "car",
        "house",
        "window",
        "school",
        "table"
    ]

},

{

    es:"puerta",

    en:"door",

    opts:[
        "door",
        "window",
        "house",
        "school",
        "table"
    ]

},

{

    es:"silla",

    en:"chair",

    opts:[
        "chair",
        "table",
        "car",
        "house",
        "school"
    ]

}

];


/* =====================================================
   VARIABLES
===================================================== */

let round = 0;

let score = 0;

let errors = 0;

let paused = false;

let shooting = false;


/* =====================================================
   ELEMENTOS
===================================================== */

const target =
document.getElementById(
    "target"
);


const answers =
document.getElementById(
    "answers"
);


const projectile =
document.getElementById(
    "projectile"
);


const game =
document.querySelector(
    ".game"
);


const video =
document.getElementById(
    "backgroundVideo"
);


/* =====================================================
   FÍSICA
===================================================== */

let bubblePhysics = [];


/* =====================================================
   CREAR RONDA
===================================================== */

function render(){

    const r =
    rounds[
        round %
        rounds.length
    ];


    target.textContent =
    r.es;


    answers.innerHTML =
    "";


    bubblePhysics = [];


    /*
       Mezclar respuestas.
    */

    const shuffled =
    [...r.opts].sort(
        () =>
        Math.random() - .5
    );


    /*
       Crear burbujas.
    */

    shuffled.forEach(
        (word,index) => {


            const bubble =
            document.createElement(
                "button"
            );


            bubble.className =
            "answer";


            bubble.textContent =
            word;


            /*
               Buscar una posición
               que no esté cerca
               de otra.
            */

            let x;

            let y;

            let attempts = 0;


            do{

                x =
                9 +
                Math.random() *
                82;


                y =
                10 +
                Math.random() *
                80;


                attempts++;

            }

            while(

                tooClose(
                    x,
                    y
                )

                &&

                attempts < 100

            );


            /*
               Dirección aleatoria.
            */

            const angle =
            Math.random()
            *
            Math.PI
            *
            2;


            /*
               Movimiento suave.
            */

            const speed =
            0.030 +
            Math.random()
            *
            0.020;


            const vx =
            Math.cos(angle)
            *
            speed;


            const vy =
            Math.sin(angle)
            *
            speed;


            /*
               Guardar datos.
            */

            const physics = {

                element:
                bubble,

                x:
                x,

                y:
                y,

                vx:
                vx,

                vy:
                vy,

                frozen:
                false

            };


            bubblePhysics.push(
                physics
            );


            /*
               Posición inicial.
            */

            bubble.style.left =
            x + "%";


            bubble.style.top =
            y + "%";


            /*
               Tocar burbuja.
            */

            bubble.addEventListener(
                "click",
                () => {

                    shoot(
                        bubble,
                        word,
                        r.en
                    );

                }
            );


            answers.appendChild(
                bubble
            );

        }
    );

}


/* =====================================================
   EVITAR POSICIONES CERCANAS
===================================================== */

function tooClose(
    x,
    y
){

    for(
        const b
        of bubblePhysics
    ){

        const dx =
        x - b.x;


        const dy =
        y - b.y;


        const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


        /*
           Separación inicial.
        */

        if(
            distance < 17
        ){

            return true;

        }

    }


    return false;

}


/* =====================================================
   ANIMACIÓN
===================================================== */

let lastTime =
performance.now();


function animateBubbles(
    currentTime
){

    const delta =
    Math.min(
        currentTime -
        lastTime,
        40
    );


    lastTime =
    currentTime;


    if(
        !paused
    ){

        const time =
        delta /
        16.67;


        /*
           MOVER
        */

        for(
            const b
            of bubblePhysics
        ){

            if(
                b.frozen
            )
            continue;


            b.x +=
            b.vx *
            time;


            b.y +=
            b.vy *
            time;


            /*
               BARRERA IZQUIERDA.
            */

            if(
                b.x <= 7
            ){

                b.x = 7;

                b.vx =
                Math.abs(
                    b.vx
                );

            }


            /*
               BARRERA DERECHA.
            */

            if(
                b.x >= 93
            ){

                b.x = 93;

                b.vx =
                -Math.abs(
                    b.vx
                );

            }


            /*
               BARRERA SUPERIOR.
            */

            if(
                b.y <= 7
            ){

                b.y = 7;

                b.vy =
                Math.abs(
                    b.vy
                );

            }


            /*
               BARRERA INFERIOR.
            */

            if(
                b.y >= 93
            ){

                b.y = 93;

                b.vy =
                -Math.abs(
                    b.vy
                );

            }

        }


        /*
           EVITAR CHOQUES
        */

        for(
            let i = 0;

            i < bubblePhysics.length;

            i++
        ){

            for(
                let j = i + 1;

                j < bubblePhysics.length;

                j++
            ){

                const a =
                bubblePhysics[i];


                const b =
                bubblePhysics[j];


                if(
                    a.frozen ||
                    b.frozen
                )
                continue;


                const dx =
                b.x - a.x;


                const dy =
                b.y - a.y;


                const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


                /*
                   Distancia mínima.
                */

                const minimum =
                13;


                if(
                    distance < minimum
                ){

                    const d =
                    distance ||
                    0.01;


                    const nx =
                    dx / d;


                    const ny =
                    dy / d;


                    const overlap =
                    minimum - d;


                    /*
                       Separarlas.
                    */

                    a.x -=
                    nx *
                    overlap /
                    2;


                    a.y -=
                    ny *
                    overlap /
                    2;


                    b.x +=
                    nx *
                    overlap /
                    2;


                    b.y +=
                    ny *
                    overlap /
                    2;


                    /*
                       Rebote.
                    */

                    const tempX =
                    a.vx;


                    const tempY =
                    a.vy;


                    a.vx =
                    b.vx;


                    a.vy =
                    b.vy;


                    b.vx =
                    tempX;


                    b.vy =
                    tempY;

                }

            }

        }


        /*
           Actualizar pantalla.
        */

        for(
            const b
            of bubblePhysics
        ){

            b.element.style.left =
            b.x + "%";


            b.element.style.top =
            b.y + "%";

        }

    }


    requestAnimationFrame(
        animateBubbles
    );

}


/* =====================================================
   DISPARO
===================================================== */

function shoot(
    bubble,
    word,
    correctWord
){

    if(
        paused ||
        shooting
    )
    return;


    shooting =
    true;


    const physics =
    bubblePhysics.find(
        b =>
        b.element === bubble
    );


    if(
        physics
    ){

        physics.frozen =
        true;

    }


    /*
       Posición actual.
    */

    const bubbleRect =
    bubble.getBoundingClientRect();


    const gameRect =
    game.getBoundingClientRect();


    const targetX =
    bubbleRect.left +
    bubbleRect.width / 2 -
    gameRect.left;


    const targetY =
    bubbleRect.top +
    bubbleRect.height / 2 -
    gameRect.top;


    /*
       Salida del proyectil.
    */

    const startX =
    gameRect.width / 2;


    const startY =
    gameRect.height - 125;


    projectile.style.display =
    "block";


    projectile.style.left =
    startX + "px";


    projectile.style.top =
    startY + "px";


    /*
       Lanzar.
    */

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    projectile.style.left =
                    targetX + "px";


                    projectile.style.top =
                    targetY + "px";

                }
            );

        }
    );


    /*
       Impacto.
    */

    setTimeout(
        () => {


            projectile.style.display =
            "none";


            /*
               Explosión.
            */

            const explosion =
            document.createElement(
                "div"
            );


            explosion.className =
            "explosion";


            explosion.style.left =
            targetX + "px";


            explosion.style.top =
            targetY + "px";


            game.appendChild(
                explosion
            );


            setTimeout(
                () => {

                    explosion.remove();

                },
                400
            );


            /*
               CORRECTA
            */

            if(
                word === correctWord
            ){

                bubble.classList.add(
                    "correct"
                );


                score++;


                document.getElementById(
                    "score"
                ).textContent =
                score;


                speakEnglish(
                    word
                );


                setTimeout(
                    () => {

                        round++;

                        shooting =
                        false;

                        render();

                    },
                    650
                );

            }


            /*
               INCORRECTA
            */

            else{

                bubble.classList.add(
                    "wrong"
                );


                errors++;


                document.getElementById(
                    "errors"
                ).textContent =
                errors;


                setTimeout(
                    () => {


                        bubble.classList.remove(
                            "wrong"
                        );


                        if(
                            physics
                        ){

                            physics.frozen =
                            false;


                            /*
                               Nueva dirección.
                            */

                            const angle =
                            Math.random()
                            *
                            Math.PI
                            *
                            2;


                            const speed =
                            0.030 +
                            Math.random()
                            *
                            0.020;


                            physics.vx =
                            Math.cos(angle)
                            *
                            speed;


                            physics.vy =
                            Math.sin(angle)
                            *
                            speed;

                        }


                        shooting =
                        false;

                    },
                    550
                );

            }

        },
        470
    );

}


/* =====================================================
   VOZ
===================================================== */

function speakEnglish(
    word
){

    if(
        !(
            "speechSynthesis"
            in window
        )
    )
    return;


    window.speechSynthesis.cancel();


    const utterance =
    new SpeechSynthesisUtterance(
        word
    );


    utterance.lang =
    "en-US";


    utterance.rate =
    0.85;


    utterance.pitch =
    1;


    window.speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   PAUSA
===================================================== */

const pause =
document.getElementById(
    "pause"
);


pause.addEventListener(
    "click",
    () => {

        paused =
        !paused;


        pause.textContent =
        paused
        ? "▶"
        : "Ⅱ";


        if(
            paused
        ){

            video.pause();

        }
        else{

            video.play();

        }

    }
);


/* =====================================================
   BOTÓN ATRÁS
===================================================== */

const backButton =
document.getElementById(
    "backButton"
);


backButton.addEventListener(
    "click",
    () => {

        if(
            history.length > 1
        ){

            history.back();

        }

    }
);


/* =====================================================
   INICIAR
===================================================== */

render();


requestAnimationFrame(
    animateBubbles
);

</script>

</body>

</html>
