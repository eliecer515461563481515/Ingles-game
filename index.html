<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Dispara la respuesta</title>


<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    background:#080a12;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    color:white;
}

body{

    display:flex;

    justify-content:center;
}

.app{

    width:100%;

    max-width:700px;

    min-height:100vh;

    padding:
    10px 8px 16px;
}



/* =========================
   BARRA SUPERIOR
========================= */

.topbar{

    height:68px;

    border:
    1px solid #2b467b;

    border-radius:22px;

    background:
    rgba(14,27,60,.96);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
    8px 12px;

    margin-bottom:14px;

    box-shadow:
    0 8px 24px #0008;

    position:relative;

    z-index:30;
}

.iconbtn{

    width:52px;
    height:52px;

    border-radius:17px;

    border:
    1px solid #2e4b82;

    background:#101f45;

    color:white;

    font-size:28px;

    font-weight:bold;
}

.title{

    font-size:20px;

    font-weight:800;

    text-align:center;
}



/* =========================
   JUEGO
========================= */

.game{

    position:relative;

    overflow:hidden;

    border-radius:28px;

    min-height:
    calc(100vh - 96px);

    background:#090d2b;

    border:
    1px solid #10183b;

    box-shadow:
    0 12px 35px #0009;
}



/* =========================
   VIDEO
========================= */

.bg{

    position:absolute;

    inset:0;

    overflow:hidden;

    z-index:0;
}

.bg video{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center bottom;

    display:block;
}

.bgShade{

    position:absolute;

    inset:0;

    background:
    rgba(3,7,28,.08);

    pointer-events:none;
}



/* =========================
   INTERFAZ
========================= */

.ui{

    position:relative;

    z-index:5;

    min-height:100%;

    height:100%;

    padding:
    20px 12px 12px;

    display:flex;

    flex-direction:column;
}



/* =========================
   MARCADOR
========================= */

.status{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:24px;
}

.pill{

    background:
    rgba(7,17,48,.78);

    border:
    1px solid #2b447a;

    border-radius:22px;

    padding:
    8px 13px;

    font-size:17px;

    font-weight:800;

    backdrop-filter:
    blur(6px);
}



/* =========================
   PALABRA EN ESPAÑOL
========================= */

.target{

    align-self:center;

    min-width:190px;

    max-width:82%;

    text-align:center;

    padding:
    12px 18px;

    border-radius:28px;

    background:
    rgba(8,19,52,.86);

    border:
    1px solid #31497a;

    box-shadow:
    0 0 25px #172f70aa;

    font-size:27px;

    font-weight:800;

    margin-bottom:10px;

    backdrop-filter:
    blur(7px);

    position:relative;

    z-index:25;
}



/* =========================
   ZONA DE MOVIMIENTO
   MÁS ABAJO PARA NO TAPAR
   LA PALABRA
========================= */

.answers{

    position:absolute;

    left:0;
    right:0;

    /*
       Empieza más abajo.
       Así deja libre la palabra.
    */

    top:220px;

    /*
       Deja espacio para el tanque.
    */

    bottom:245px;

    z-index:10;

    overflow:hidden;
}



/* =========================
   BURBUJAS
========================= */

.answer{

    position:absolute;

    width:86px;
    height:86px;

    border-radius:50%;

    border:
    1px solid #79adff;

    background:
    radial-gradient(
        circle at 30% 25%,
        #76adff,
        #3475df 55%,
        #174db6
    );

    color:white;

    font-size:15px;

    font-weight:800;

    box-shadow:

    0 0 20px #1871ff99,

    inset
    0 2px 5px #ffffff55;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:8px;

    cursor:pointer;

    transform:
    translate(-50%,-50%);

    transition:

    background .2s,

    box-shadow .2s,

    transform .15s;

    will-change:
    left,
    top;
}


.answer:active{

    transform:
    translate(-50%,-50%)
    scale(.92);
}



/* =========================
   CORRECTA
========================= */

.answer.correct{

    background:
    radial-gradient(
        circle at 30% 25%,
        #65ff9a,
        #16c957 55%,
        #087c35
    );

    border-color:
    #8affb2;

    box-shadow:

    0 0 28px #00ff66;
}



/* =========================
   INCORRECTA
========================= */

.answer.wrong{

    background:
    radial-gradient(
        circle at 30% 25%,
        #ff7777,
        #e52e43 55%,
        #8e1020
    );

    border-color:
    #ffaaaa;

    box-shadow:

    0 0 28px #ff1e3c;
}



/* =========================
   PROYECTIL
========================= */

.projectile{

    position:absolute;

    width:13px;

    height:30px;

    border-radius:50%;

    background:
    linear-gradient(
        to bottom,
        #ffffff,
        #00eaff,
        #087bff
    );

    box-shadow:

    0 0 8px #ffffff,

    0 0 18px #00eaff,

    0 0 35px #008cff;

    z-index:20;

    pointer-events:none;

    transform:
    translate(-50%,-50%);

    transition:

    left .45s
    cubic-bezier(.25,.8,.3,1),

    top .45s
    cubic-bezier(.25,.8,.3,1);
}



/* =========================
   EXPLOSIÓN
========================= */

.explosion{

    position:absolute;

    width:25px;
    height:25px;

    border-radius:50%;

    background:#ffffff;

    box-shadow:

    0 0 10px #fff,

    0 0 25px #00eaff,

    0 0 45px #008cff;

    z-index:21;

    pointer-events:none;

    animation:
    boom .35s ease-out forwards;
}


@keyframes boom{

    0%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        scale(.3);
    }

    100%{

        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(3);
    }
}



/* =========================
   CELULAR
========================= */

@media(max-width:430px){

    .app{

        padding:
        10px 8px 15px;
    }

    .title{

        font-size:18px;
    }

    .target{

        font-size:25px;

        margin-top:2px;

        margin-bottom:0;
    }

    .answers{

        /*
          Más abajo todavía
          en celular.
        */

        top:215px;

        bottom:235px;
    }

    .answer{

        width:84px;
        height:84px;

        font-size:14px;
    }

}

</style>

</head>



<body>


<div class="app">



<!-- =========================
     BARRA SUPERIOR
========================= -->

<header class="topbar">


<button
class="iconbtn"
id="backButton">

‹

</button>


<div class="title">

🚀 Dispara la respuesta

</div>


<button
class="iconbtn"
id="pause">

Ⅱ

</button>


</header>



<!-- =========================
     JUEGO
========================= -->

<main class="game">



<!-- =========================
     VIDEO DEL TANQUE
========================= -->

<div class="bg">


<video

id="backgroundVideo"

autoplay

muted

playsinline

loop

preload="auto"

src="tmp996ypisb.mp4">

</video>


<div
class="bgShade">
</div>


</div>



<!-- =========================
     INTERFAZ
========================= -->

<section class="ui">



<!-- MARCADOR -->

<div class="status">


<div class="pill">

✅

<span id="score">

0

</span>


❌

<span id="errors">

0

</span>

</div>



<div class="pill">

⏱

<span id="time">

02:29

</span>

</div>


</div>



<!-- PALABRA -->

<div class="target">


<span id="target">

dinero

</span>


🔊


</div>



<!-- BURBUJAS -->

<div
class="answers"
id="answers">
</div>



</section>



<!-- =========================
     PROYECTIL
========================= -->

<div

id="projectile"

class="projectile"

style="display:none;">

</div>



</main>



</div>



<script>


/* =========================
   PALABRAS
========================= */

const rounds = [

{

es:"dinero",

en:"money",

opts:[
"money",
"noodles",
"mop",
"ice cream",
"rice"
]

},

{

es:"casa",

en:"house",

opts:[
"house",
"school",
"window",
"table",
"car"
]

},

{

es:"ventana",

en:"window",

opts:[
"window",
"door",
"chair",
"money",
"house"
]

},

{

es:"escuela",

en:"school",

opts:[
"school",
"table",
"car",
"house",
"rice"
]

},

{

es:"mesa",

en:"table",

opts:[
"table",
"window",
"car",
"school",
"house"
]

},

{

es:"carro",

en:"car",

opts:[
"car",
"house",
"window",
"school",
"table"
]

},

{

es:"puerta",

en:"door",

opts:[
"door",
"window",
"house",
"school",
"table"
]

},

{

es:"silla",

en:"chair",

opts:[
"chair",
"table",
"car",
"house",
"school"
]

}

];



/* =========================
   VARIABLES
========================= */

let round = 0;

let score = 0;

let errors = 0;

let paused = false;

let shooting = false;



const target =
document.getElementById(
"target"
);


const answers =
document.getElementById(
"answers"
);


const projectile =
document.getElementById(
"projectile"
);


const game =
document.querySelector(
".game"
);


const video =
document.getElementById(
"backgroundVideo"
);



/* =========================
   FÍSICA DE BURBUJAS
========================= */

/*
   Cada burbuja tiene:

   x  = posición horizontal
   y  = posición vertical
   vx = velocidad horizontal
   vy = velocidad vertical

   De esta forma pueden moverse
   en cualquier dirección.
*/


let bubblePhysics = [];



/* =========================
   CREAR RONDA
========================= */

function render(){


const r =
rounds[
round %
rounds.length
];


target.textContent =
r.es;


answers.innerHTML =
"";


bubblePhysics = [];



/*
   Mezclar respuestas
*/

const shuffled =
[...r.opts].sort(
() =>
Math.random() - .5
);



/*
   Crear burbujas
*/

shuffled.forEach(
(word,index) => {


const bubble =
document.createElement(
"button"
);


bubble.className =
"answer";


bubble.textContent =
word;



/*
   Crear posición segura
*/

let x;
let y;

let tries = 0;


do{

    x =
    12 +
    Math.random() * 76;

    y =
    12 +
    Math.random() * 76;

    tries++;

}
while(
    isTooClose(
        x,
        y
    )
    &&
    tries < 100
);



/*
   Velocidad aleatoria
*/

let angle =
Math.random()
*
Math.PI
*
2;



let speed =
0.018 +
Math.random()
*
0.014;



let vx =
Math.cos(angle)
*
speed;



let vy =
Math.sin(angle)
*
speed;



/*
   Guardar física
*/

bubblePhysics.push({

    element:
    bubble,

    x:
    x,

    y:
    y,

    vx:
    vx,

    vy:
    vy,

    radius:
    43,

    frozen:
    false

});



/*
   Posición inicial
*/

bubble.style.left =
x + "%";


bubble.style.top =
y + "%";



/*
   Evento tocar
*/

bubble.addEventListener(
"click",
() => {

    shoot(
        bubble,
        word,
        r.en
    );

});



answers.appendChild(
bubble
);

});

}



/* =========================
   EVITAR POSICIONES INICIALES
   DEMASIADO CERCANAS
========================= */

function isTooClose(
x,
y
){


for(
const b
of bubblePhysics
){


const dx =
x - b.x;


const dy =
y - b.y;



const distance =
Math.sqrt(
dx*dx +
dy*dy
);



if(
distance < 18
){

return true;

}

}


return false;

}



/* =========================
   ANIMACIÓN
========================= */

let lastTime =
performance.now();



function animateBubbles(
currentTime
){


const delta =
Math.min(
currentTime -
lastTime,
40
);


lastTime =
currentTime;



if(
!paused
){


const areaWidth =
answers.clientWidth;


const areaHeight =
answers.clientHeight;



/*
   Factor de tiempo.
*/

const time =
delta / 16.67;



/*
   MOVER BURBUJAS
*/

for(
const b
of bubblePhysics
){


if(
b.frozen
)
continue;



/*
   Mover
*/

b.x +=
b.vx *
time;


b.y +=
b.vy *
time;



/*
   Límites horizontales
*/

if(
b.x <= 8
){

b.x = 8;

b.vx =
Math.abs(
b.vx
);

}


if(
b.x >= 92
){

b.x = 92;

b.vx =
-Math.abs(
b.vx
);

}



/*
   Límites verticales
*/

if(
b.y <= 8
){

b.y = 8;

b.vy =
Math.abs(
b.vy
);

}


if(
b.y >= 92
){

b.y = 92;

b.vy =
-Math.abs(
b.vy
);

}

}



/*
   COLISIONES ENTRE BURBUJAS
*/

for(
let i=0;

i<bubblePhysics.length;

i++
){


for(
let j=i+1;

j<bubblePhysics.length;

j++
){


const a =
bubblePhysics[i];


const b =
bubblePhysics[j];



if(
a.frozen ||
b.frozen
)
continue;



const dx =
b.x - a.x;


const dy =
b.y - a.y;



const distance =
Math.sqrt(
dx*dx +
dy*dy
);



/*
   Distancia mínima.

   12% del ancho aprox.
*/

const minimum =
15;



if(
distance < minimum
){


/*
   Evitar división por cero.
*/

const safeDistance =
distance ||
0.01;



/*
   Vector de separación.
*/

const nx =
dx /
safeDistance;


const ny =
dy /
safeDistance;



const overlap =
minimum -
safeDistance;



/*
   Separarlas.
*/

a.x -=
nx *
overlap /
2;


a.y -=
ny *
overlap /
2;


b.x +=
nx *
overlap /
2;


b.y +=
ny *
overlap /
2;



/*
   Cambiar dirección
   para simular rebote.
*/

const tempVx =
a.vx;


const tempVy =
a.vy;



a.vx =
b.vx;


a.vy =
b.vy;


b.vx =
tempVx;


b.vy =
tempVy;

}

}

}



/*
   ACTUALIZAR PANTALLA
*/

for(
const b
of bubblePhysics
){


b.element.style.left =
b.x + "%";


b.element.style.top =
b.y + "%";

}

}



/*
   Siguiente frame
*/

requestAnimationFrame(
animateBubbles
);

}



/* =========================
   DISPARO
========================= */

function shoot(
bubble,
word,
correctWord
){


if(
paused ||
shooting
)
return;



shooting =
true;



/*
   Encontrar física
   de la burbuja.
*/

const physics =
bubblePhysics.find(
b =>
b.element === bubble
);



if(
physics
){

/*
   Detener la burbuja
   durante el disparo.
*/

physics.frozen =
true;

}



/*
   Posición actual
*/

const bubbleRect =
bubble.getBoundingClientRect();


const gameRect =
game.getBoundingClientRect();



const targetX =

bubbleRect.left +

bubbleRect.width / 2 -

gameRect.left;



const targetY =

bubbleRect.top +

bubbleRect.height / 2 -

gameRect.top;



/*
   Salida del proyectil
*/

const startX =
gameRect.width / 2;


const startY =
gameRect.height - 135;



projectile.style.display =
"block";


projectile.style.left =
startX + "px";


projectile.style.top =
startY + "px";



/*
   Lanzar
*/

requestAnimationFrame(
() => {

requestAnimationFrame(
() => {

projectile.style.left =
targetX + "px";


projectile.style.top =
targetY + "px";

});

});



/*
   Impacto
*/

setTimeout(
() => {


projectile.style.display =
"none";



/*
   Explosión
*/

const explosion =
document.createElement(
"div"
);


explosion.className =
"explosion";


explosion.style.left =
targetX + "px";


explosion.style.top =
targetY + "px";


game.appendChild(
explosion
);


setTimeout(
() => {

explosion.remove();

},
400
);



/* =========================
   CORRECTA
========================= */

if(
word === correctWord
){


bubble.classList.add(
"correct"
);


score++;


document.getElementById(
"score"
).textContent =
score;



/*
   Pronunciar
*/

speakEnglish(
word
);



/*
   Siguiente
*/

setTimeout(
() => {

round++;

shooting =
false;

render();

},
650
);

}



/* =========================
   INCORRECTA
========================= */

else{


bubble.classList.add(
"wrong"
);


errors++;


document.getElementById(
"errors"
).textContent =
errors;



/*
   Regresar a azul
*/

setTimeout(
() => {


bubble.classList.remove(
"wrong"
);



if(
physics
){

physics.frozen =
false;


/*
   Darle una nueva
   dirección aleatoria
*/

const angle =
Math.random()
*
Math.PI
*
2;


const speed =
0.018 +
Math.random()
*
0.014;


physics.vx =
Math.cos(angle)
*
speed;


physics.vy =
Math.sin(angle)
*
speed;

}


shooting =
false;

},
550
);

}

},
470
);

}



/* =========================
   VOZ EN INGLÉS
========================= */

function speakEnglish(
word
){


if(
!(
"speechSynthesis"
in window
)
)
return;



window.speechSynthesis.cancel();



const utterance =
new SpeechSynthesisUtterance(
word
);


utterance.lang =
"en-US";


utterance.rate =
0.85;


utterance.pitch =
1;



window.speechSynthesis.speak(
utterance
);

}



/* =========================
   PAUSA
========================= */

const pause =
document.getElementById(
"pause"
);


pause.addEventListener(
"click",
() => {


paused =
!paused;


pause.textContent =
paused
? "▶"
: "Ⅱ";



if(
paused
){

video.pause();

}else{

video.play();

}

});



/* =========================
   BOTÓN ATRÁS
========================= */

const backButton =
document.getElementById(
"backButton"
);


backButton.addEventListener(
"click",
() => {


if(
history.length > 1
){

history.back();

}

});



/* =========================
   INICIAR
========================= */

render();


requestAnimationFrame(
animateBubbles
);


</script>

</body>

</html>
