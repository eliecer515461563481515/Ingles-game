<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Dispara la respuesta</title>


<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    background:#080a12;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    color:white;
}


body{

    display:flex;

    justify-content:center;
}


.app{

    width:100%;

    max-width:700px;

    min-height:100vh;

    padding:
    10px 8px 16px;
}



/* =========================
   BARRA SUPERIOR
========================= */

.topbar{

    height:68px;

    border:
    1px solid #2b467b;

    border-radius:22px;

    background:
    rgba(14,27,60,.96);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
    8px 12px;

    margin-bottom:14px;

    box-shadow:
    0 8px 24px #0008;

    position:relative;

    z-index:30;
}


.iconbtn{

    width:52px;
    height:52px;

    border-radius:17px;

    border:
    1px solid #2e4b82;

    background:#101f45;

    color:white;

    font-size:28px;

    font-weight:bold;
}


.title{

    font-size:20px;

    font-weight:800;

    text-align:center;
}



/* =========================
   ÁREA DEL JUEGO
========================= */

.game{

    position:relative;

    overflow:hidden;

    border-radius:28px;

    min-height:
    calc(100vh - 96px);

    background:#090d2b;

    border:
    1px solid #10183b;

    box-shadow:
    0 12px 35px #0009;
}



/* =========================
   VIDEO DE FONDO
========================= */

.bg{

    position:absolute;

    inset:0;

    overflow:hidden;

    z-index:0;
}


.bg video{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center bottom;

    display:block;
}


.bgShade{

    position:absolute;

    inset:0;

    background:
    rgba(3,7,28,.08);

    pointer-events:none;
}



/* =========================
   INTERFAZ
========================= */

.ui{

    position:relative;

    z-index:5;

    min-height:100%;

    height:100%;

    padding:
    20px 12px 12px;

    display:flex;

    flex-direction:column;
}



/* =========================
   MARCADOR
========================= */

.status{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:24px;
}


.pill{

    background:
    rgba(7,17,48,.78);

    border:
    1px solid #2b447a;

    border-radius:22px;

    padding:
    8px 13px;

    font-size:17px;

    font-weight:800;

    backdrop-filter:
    blur(6px);
}



/* =========================
   PALABRA PRINCIPAL
========================= */

.target{

    align-self:center;

    min-width:190px;

    max-width:82%;

    text-align:center;

    padding:
    12px 18px;

    border-radius:28px;

    background:
    rgba(8,19,52,.82);

    border:
    1px solid #31497a;

    box-shadow:
    0 0 25px #172f70aa;

    font-size:27px;

    font-weight:800;

    margin-bottom:10px;

    backdrop-filter:
    blur(7px);
}



/* =========================
   ZONA DE BURBUJAS
========================= */

.answers{

    position:absolute;

    left:0;
    right:0;

    top:145px;

    bottom:205px;

    z-index:10;
}



/* =========================
   BURBUJAS
========================= */

.answer{

    position:absolute;

    width:88px;
    height:88px;

    border-radius:50%;

    border:
    1px solid #79adff;

    background:
    radial-gradient(
        circle at 30% 25%,
        #76adff,
        #3475df 55%,
        #174db6
    );

    color:white;

    font-size:15px;

    font-weight:800;

    box-shadow:

    0 0 20px #1871ff99,

    inset
    0 2px 5px #ffffff55;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:8px;

    cursor:pointer;

    transform:
    translate(-50%,-50%);

    transition:

    background .2s,

    box-shadow .2s,

    transform .15s;

    will-change:
    left,
    top;
}


.answer:active{

    transform:
    translate(-50%,-50%)
    scale(.92);
}



/* =========================
   BURBUJA CORRECTA
========================= */

.answer.correct{

    background:
    radial-gradient(
        circle at 30% 25%,
        #65ff9a,
        #16c957 55%,
        #087c35
    );

    border-color:
    #8affb2;

    box-shadow:

    0 0 28px #00ff66;
}



/* =========================
   BURBUJA INCORRECTA
========================= */

.answer.wrong{

    background:
    radial-gradient(
        circle at 30% 25%,
        #ff7777,
        #e52e43 55%,
        #8e1020
    );

    border-color:
    #ffaaaa;

    box-shadow:

    0 0 28px #ff1e3c;
}



/* =========================
   PROYECTIL
========================= */

.projectile{

    position:absolute;

    width:13px;

    height:30px;

    border-radius:50%;

    background:
    linear-gradient(
        to bottom,
        #ffffff,
        #00eaff,
        #087bff
    );

    box-shadow:

    0 0 8px #ffffff,

    0 0 18px #00eaff,

    0 0 35px #008cff;

    z-index:15;

    pointer-events:none;

    transform:
    translate(-50%,-50%);

    transition:

    left .45s
    cubic-bezier(.25,.8,.3,1),

    top .45s
    cubic-bezier(.25,.8,.3,1);
}



/* =========================
   EXPLOSIÓN
========================= */

.explosion{

    position:absolute;

    width:25px;
    height:25px;

    border-radius:50%;

    background:#ffffff;

    box-shadow:

    0 0 10px #fff,

    0 0 25px #00eaff,

    0 0 45px #008cff;

    z-index:16;

    pointer-events:none;

    animation:
    boom .35s ease-out forwards;
}


@keyframes boom{

    0%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        scale(.3);
    }

    100%{

        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(3);
    }
}



/* =========================
   CELULAR
========================= */

@media(max-width:430px){

    .app{

        padding:
        10px 8px 15px;
    }


    .title{

        font-size:18px;
    }


    .target{

        font-size:25px;

        margin-top:2px;
    }


    .answers{

        top:145px;

        bottom:205px;
    }


    .answer{

        width:88px;
        height:88px;

        font-size:15px;
    }

}

</style>

</head>



<body>


<div class="app">



<!-- =========================
     BARRA SUPERIOR
========================= -->

<header class="topbar">


<button
class="iconbtn"
id="backButton">

‹

</button>


<div class="title">

🚀 Dispara la respuesta

</div>


<button
class="iconbtn"
id="pause">

Ⅱ

</button>


</header>



<!-- =========================
     JUEGO
========================= -->

<main class="game">



<!-- =========================
     VIDEO
========================= -->

<div class="bg">


<video

id="backgroundVideo"

autoplay

muted

playsinline

loop

preload="auto"

src="tmp996ypisb.mp4">

</video>


<div
class="bgShade">
</div>


</div>



<!-- =========================
     INTERFAZ
========================= -->

<section class="ui">



<!-- MARCADOR -->

<div class="status">


<div class="pill">

✅

<span id="score">

0

</span>


❌

<span id="errors">

0

</span>

</div>



<div class="pill">

⏱

<span id="time">

02:29

</span>

</div>


</div>



<!-- PALABRA -->

<div class="target">


<span id="target">

dinero

</span>


🔊


</div>



<!-- BURBUJAS -->

<div
class="answers"
id="answers">
</div>



</section>



<!-- =========================
     PROYECTIL
========================= -->

<div

id="projectile"

class="projectile"

style="display:none;">

</div>



</main>



</div>



<script>


/* =========================
   PALABRAS
========================= */

const rounds = [

{

es:"dinero",

en:"money",

opts:[

"money",

"noodles",

"mop",

"ice cream",

"rice"

]

},


{

es:"casa",

en:"house",

opts:[

"house",

"school",

"window",

"table",

"car"

]

},


{

es:"ventana",

en:"window",

opts:[

"window",

"door",

"chair",

"money",

"house"

]

},


{

es:"escuela",

en:"school",

opts:[

"school",

"table",

"car",

"house",

"rice"

]

},


{

es:"mesa",

en:"table",

opts:[

"table",

"window",

"car",

"school",

"house"

]

},


{

es:"carro",

en:"car",

opts:[

"car",

"house",

"window",

"school",

"table"

]

},


{

es:"escuela",

en:"school",

opts:[

"school",

"money",

"rice",

"car",

"window"

]

}

];



/* =========================
   VARIABLES
========================= */

let round = 0;

let score = 0;

let errors = 0;

let paused = false;

let shooting = false;



const target =
document.getElementById(
"target"
);


const answers =
document.getElementById(
"answers"
);


const projectile =
document.getElementById(
"projectile"
);


const game =
document.querySelector(
".game"
);


const video =
document.getElementById(
"backgroundVideo"
);



/* =========================
   POSICIONES INICIALES
========================= */

const bubblePositions = [

{
x:18,
y:18,
speed:.045,
direction:1
},

{
x:78,
y:31,
speed:.035,
direction:-1
},

{
x:45,
y:44,
speed:.050,
direction:1
},

{
x:20,
y:58,
speed:.040,
direction:-1
},

{
x:76,
y:72,
speed:.045,
direction:1
}

];



/* =========================
   CREAR UNA RONDA
========================= */

function render(){


const r =
rounds[
round %
rounds.length
];


target.textContent =
r.es;


answers.innerHTML =
"";


/*
Mezclar respuestas
*/

const shuffled =
[...r.opts].sort(
() =>
Math.random() - .5
);



/*
Crear burbujas
*/

shuffled.forEach(
(word,index) => {


const bubble =
document.createElement(
"button"
);


bubble.className =
"answer";


bubble.textContent =
word;



const pos =
bubblePositions[index];



bubble.dataset.x =
pos.x;


bubble.dataset.y =
pos.y;


bubble.dataset.speed =
pos.speed;


bubble.dataset.direction =
pos.direction;



bubble.style.left =
pos.x + "%";


bubble.style.top =
pos.y + "%";



bubble.addEventListener(
"click",
() => {

shoot(

bubble,

word,

r.en

);

});



answers.appendChild(
bubble
);

});

}



/* =========================
   DISPARO
========================= */

function shoot(
bubble,
word,
correctWord
){


if(
paused ||
shooting
)
return;



shooting =
true;



/*
Obtener posición
actual de la burbuja
*/

const bubbleRect =
bubble.getBoundingClientRect();


const gameRect =
game.getBoundingClientRect();



const targetX =

bubbleRect.left +

bubbleRect.width / 2 -

gameRect.left;



const targetY =

bubbleRect.top +

bubbleRect.height / 2 -

gameRect.top;



/*
Posición inicial
del proyectil
*/

const startX =
gameRect.width / 2;


const startY =
gameRect.height - 135;



projectile.style.display =
"block";


projectile.style.left =
startX + "px";


projectile.style.top =
startY + "px";



/*
Animar proyectil
*/

requestAnimationFrame(
() => {

requestAnimationFrame(
() => {

projectile.style.left =
targetX + "px";


projectile.style.top =
targetY + "px";

});

});



/*
Impacto
*/

setTimeout(
() => {


projectile.style.display =
"none";



/*
Crear explosión
*/

const explosion =
document.createElement(
"div"
);


explosion.className =
"explosion";


explosion.style.left =
targetX + "px";


explosion.style.top =
targetY + "px";


game.appendChild(
explosion
);


setTimeout(
() => {

explosion.remove();

},
400
);



/* =====================
   CORRECTA
===================== */

if(
word === correctWord
){


bubble.classList.add(
"correct"
);


score++;


document.getElementById(
"score"
).textContent =
score;



/*
Pronunciar inglés
*/

speakEnglish(
word
);



/*
Siguiente palabra
*/

setTimeout(
() => {

round++;

shooting =
false;

render();

},
650
);

}


/* =====================
   INCORRECTA
===================== */

else{


bubble.classList.add(
"wrong"
);


errors++;


document.getElementById(
"errors"
).textContent =
errors;



/*
Regresar a azul
*/

setTimeout(
() => {

bubble.classList.remove(
"wrong"
);

shooting =
false;

},
550
);

}

},
470
);

}



/* =========================
   PRONUNCIACIÓN
========================= */

function speakEnglish(
word
){


if(
!("speechSynthesis"
in window)
)
return;



window.speechSynthesis.cancel();



const utterance =
new SpeechSynthesisUtterance(
word
);


utterance.lang =
"en-US";


utterance.rate =
0.85;


utterance.pitch =
1;



window.speechSynthesis.speak(
utterance
);

}



/* =========================
   MOVIMIENTO DE BURBUJAS
========================= */

let animationFrame;



function animateBubbles(){


if(
!paused
){


const bubbles =
[
...document.querySelectorAll(
".answer"
)
];


const area =
document.getElementById(
"answers"
);


const width =
area.clientWidth;


const height =
area.clientHeight;



const bubbleSize =
88;


const radius =
bubbleSize / 2;



/*
Mover cada burbuja
*/

bubbles.forEach(
bubble => {


let x =
parseFloat(
bubble.dataset.x
);


let direction =
parseFloat(
bubble.dataset.direction
);


const speed =
parseFloat(
bubble.dataset.speed
);



x +=
speed *
direction;



/*
Límites laterales
*/

const minX =
(
radius /
width
) * 100;


const maxX =
100 -
(
radius /
width
) * 100;



/*
Rebote
*/

if(
x >= maxX
){

x =
maxX;

direction =
-1;

}



if(
x <= minX
){

x =
minX;

direction =
1;

}



bubble.dataset.x =
x;


bubble.dataset.direction =
direction;


bubble.style.left =
x + "%";

});



/*
=========================
EVITAR COLISIONES
=========================
*/

for(
let i=0;

i<bubbles.length;

i++
){


for(
let j=i+1;

j<bubbles.length;

j++
){


const a =
bubbles[i];


const b =
bubbles[j];



const ax =
parseFloat(
a.dataset.x
)
/
100
*
width;


const ay =
parseFloat(
a.dataset.y
)
/
100
*
height;



const bx =
parseFloat(
b.dataset.x
)
/
100
*
width;


const by =
parseFloat(
b.dataset.y
)
/
100
*
height;



const dx =
bx - ax;


const dy =
by - ay;



const distance =
Math.sqrt(
dx*dx +
dy*dy
);



/*
Distancia mínima
*/

const minimumDistance =
bubbleSize + 10;



if(
distance <
minimumDistance
){


/*
Separar un poco
*/

const push =
(
minimumDistance -
distance
)
/
2;



if(
ax < bx
){

a.dataset.x =
parseFloat(
a.dataset.x
) -
(
push /
width *
100
);

b.dataset.x =
parseFloat(
b.dataset.x
) +
(
push /
width *
100
);

}else{

a.dataset.x =
parseFloat(
a.dataset.x
) +
(
push /
width *
100
);

b.dataset.x =
parseFloat(
b.dataset.x
) -
(
push /
width *
100
);

}



/*
Cambiar dirección
*/

a.dataset.direction =
-parseFloat(
a.dataset.direction
);


b.dataset.direction =
-parseFloat(
b.dataset.direction
);

}

}

}

}



/*
Siguiente frame
*/

animationFrame =
requestAnimationFrame(
animateBubbles
);

}



/* =========================
   PAUSA
========================= */

const pause =
document.getElementById(
"pause"
);


pause.addEventListener(
"click",
() => {


paused =
!paused;



pause.textContent =
paused
? "▶"
: "Ⅱ";



if(
paused
){

video.pause();

}else{

video.play();

}

});



/* =========================
   BOTÓN ATRÁS
========================= */

const backButton =
document.getElementById(
"backButton"
);


backButton.addEventListener(
"click",
() => {


if(
history.length > 1
){

history.back();

}

});



/* =========================
   INICIAR JUEGO
========================= */

render();


animateBubbles();



</script>

</body>

</html>
