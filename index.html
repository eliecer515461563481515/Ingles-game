<html lang="es">

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Dispara la respuesta</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    background:#050711;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    color:white;
}

body{
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:700px;

    min-height:100vh;

    padding:
    10px
    8px
    16px;
}


/* =====================================================
   BARRA SUPERIOR
===================================================== */

.topbar{

    height:68px;

    border:
    1px solid
    #294477;

    border-radius:22px;

    background:
    rgba(
        10,
        22,
        52,
        .96
    );

    display:flex;

    align-items:center;

    justify-content:
    space-between;

    padding:
    8px
    12px;

    margin-bottom:14px;

    box-shadow:
    0 8px 25px
    rgba(
        0,
        0,
        0,
        .55
    );

    position:relative;

    z-index:100;
}

.iconbtn{

    width:50px;
    height:50px;

    border-radius:16px;

    border:
    1px solid
    #35558d;

    background:#101f43;

    color:white;

    font-size:27px;

    font-weight:bold;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.title{

    font-size:19px;

    font-weight:800;

    text-align:center;
}


/* =====================================================
   JUEGO
===================================================== */

.game{

    position:relative;

    width:100%;

    height:
    calc(
        100vh - 96px
    );

    min-height:650px;

    overflow:hidden;

    border-radius:28px;

    background:#080d2a;

    border:
    1px solid
    #101b3e;

    box-shadow:
    0 12px 35px
    rgba(
        0,
        0,
        0,
        .65
    );
}


/* =====================================================
   VIDEO DE FONDO
===================================================== */

.bg{

    position:absolute;

    inset:0;

    overflow:hidden;

    z-index:0;
}

.bg video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:
    center bottom;

    display:block;
}

.bgShade{

    position:absolute;

    inset:0;

    background:
    rgba(
        3,
        7,
        28,
        .06
    );

    pointer-events:none;
}


/* =====================================================
   INTERFAZ
===================================================== */

.ui{

    position:absolute;

    inset:0;

    z-index:5;

    pointer-events:none;
}


/* =====================================================
   MARCADOR
===================================================== */

.status{

    position:absolute;

    top:20px;

    left:12px;
    right:12px;

    display:flex;

    justify-content:
    space-between;

    align-items:center;

    z-index:50;
}

.pill{

    background:
    rgba(
        7,
        17,
        48,
        .84
    );

    border:
    1px solid
    #2b447a;

    border-radius:22px;

    padding:
    8px
    13px;

    font-size:17px;

    font-weight:800;

    backdrop-filter:
    blur(6px);

    white-space:nowrap;
}


/* =====================================================
   PALABRA ESPAÑOLA
===================================================== */

.target{

    position:absolute;

    top:100px;

    left:50%;

    transform:
    translateX(-50%);

    min-width:190px;

    max-width:82%;

    padding:
    12px
    18px;

    border-radius:28px;

    background:
    rgba(
        8,
        19,
        52,
        .90
    );

    border:
    1px solid
    #31497a;

    box-shadow:
    0 0 25px
    rgba(
        23,
        47,
        112,
        .65
    );

    font-size:27px;

    font-weight:800;

    text-align:center;

    backdrop-filter:
    blur(7px);

    z-index:60;

    pointer-events:auto;

    white-space:nowrap;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;
}

.speaker{

    border:0;

    background:transparent;

    color:white;

    font-size:27px;

    padding:0;

    cursor:pointer;

    line-height:1;
}


/* =====================================================
   ZONA DE BURBUJAS
===================================================== */

/*
   IMPORTANTE:

   Esta zona es una "caja invisible".

   Las burbujas NUNCA podrán salir
   de ella.

   Arriba:
   deja espacio para la palabra española.

   Abajo:
   deja espacio para el tanque.

   Izquierda/derecha:
   deja margen de seguridad.
*/

.answers{

    position:absolute;

    left:35px;
    right:35px;

    top:205px;

    bottom:255px;

    overflow:hidden;

    z-index:20;

    pointer-events:none;

}


/* =====================================================
   BURBUJAS
===================================================== */

.answer{

    position:absolute;

    width:70px;
    height:70px;

    margin:0;

    padding:5px;

    border-radius:50%;

    border:
    1px solid
    #80b5ff;

    background:
    radial-gradient(
        circle at 30% 25%,
        #82b5ff,
        #3b7de5 55%,
        #174db4
    );

    color:white;

    font-size:12px;

    font-weight:800;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    box-shadow:
    0 0 17px
    rgba(
        24,
        113,
        255,
        .60
    ),

    inset
    0 2px 5px
    rgba(
        255,
        255,
        255,
        .35
    );

    cursor:pointer;

    pointer-events:auto;

    user-select:none;

    will-change:
    left,
    top;

    z-index:30;

    /*
       ESTA ES LA CORRECCIÓN IMPORTANTE.

       left/top representan ahora
       EL CENTRO de la burbuja.
    */

    transform:
    translate(
        -50%,
        -50%
    );

    transition:
    background .15s ease,
    box-shadow .15s ease;
}

.answer:active{

    transform:
    translate(
        -50%,
        -50%
    )
    scale(.94);
}


/* =====================================================
   CORRECTA
===================================================== */

.answer.correct{

    background:
    radial-gradient(
        circle at 30% 25%,
        #72ff9e,
        #16c957 55%,
        #087c35
    );

    border-color:
    #9affbd;

    box-shadow:
    0 0 30px
    #00ff66,

    inset
    0 2px 5px
    rgba(
        255,
        255,
        255,
        .4
    );
}


/* =====================================================
   INCORRECTA
===================================================== */

.answer.wrong{

    background:
    radial-gradient(
        circle at 30% 25%,
        #ff7777,
        #e52e43 55%,
        #8e1020
    );

    border-color:
    #ffaaaa;

    box-shadow:
    0 0 28px
    #ff1e3c;
}


/* =====================================================
   PROYECTIL
===================================================== */

.projectile{

    position:absolute;

    width:12px;
    height:30px;

    border-radius:50%;

    background:
    linear-gradient(
        to bottom,
        #ffffff,
        #00eaff,
        #087bff
    );

    box-shadow:
    0 0 8px
    #ffffff,

    0 0 18px
    #00eaff,

    0 0 35px
    #008cff;

    z-index:80;

    pointer-events:none;

    transform:
    translate(
        -50%,
        -50%
    );

    transition:
    left .45s
    cubic-bezier(
        .25,
        .8,
        .3,
        1
    ),

    top .45s
    cubic-bezier(
        .25,
        .8,
        .3,
        1
    );
}


/* =====================================================
   EXPLOSIÓN
===================================================== */

.explosion{

    position:absolute;

    width:25px;
    height:25px;

    border-radius:50%;

    background:white;

    box-shadow:
    0 0 10px white,

    0 0 25px
    #00eaff,

    0 0 45px
    #008cff;

    z-index:90;

    pointer-events:none;

    animation:
    boom .35s
    ease-out
    forwards;
}

@keyframes boom{

    0%{

        opacity:1;

        transform:
        translate(
            -50%,
            -50%
        )
        scale(.3);
    }

    100%{

        opacity:0;

        transform:
        translate(
            -50%,
            -50%
        )
        scale(3);
    }
}


/* =====================================================
   CELULARES
===================================================== */

    */

    }


    .answer{

    }

}

    .answers{

        top:190px;

        bottom:235px;
    }


    .target{

        top:90px;

        font-size:23px;
    }

}

<script>


/* =====================================================
   PALABRAS
===================================================== */

const rounds = [

{
    es:"dinero",
    en:"money",

    opts:[
        "money",
        "noodles",
        "mop",
        "ice cream",
        "rice"
    ]
},

{
    es:"casa",
    en:"house",

    opts:[
        "house",
        "school",
        "window",
        "table",

    ]
},

{

    en:"window",

    opts:[
        "window",

        "chair",
        "money",
        "house"
    ]
},

{
    es:"escuela",
    en:"school",

    opts:[
        "school",
        "table",
        "car",
        "house",
        "rice"
    ]
},

{
    es:"mesa",
    en:"table",

    opts:[
        "table",
        "window",
        "car",
        "school",
        "house"
    ]
},

{
    es:"carro",
    en:"car",

    opts:[
        "car",
        "house",
        "window",
        "school",
        "table"
    ]
},

{
    es:"puerta",
    en:"door",

    opts:[
        "door",
        "window",
        "house",
        "school",
        "table"
    ]
},

{
    es:"silla",
    en:"chair",

    opts:[
        "chair",
        "table",
        "car",
        "house",
        "school"
    ]
},

{
    es:"comida",
    en:"food",

    opts:[
        "food",
        "water",
        "money",
        "house",
        "car"
    ]
},

{
    es:"agua",
    en:"water",

    opts:[
        "water",
        "food",
        "rice",
        "school",
        "chair"
    ]
}

];


/* =====================================================
   VARIABLES
===================================================== */

let round = 0;

let score = 0;

let errors = 0;

let paused = false;

let shooting = false;

let bubbles = [];

let lastTime =
performance.now();


/* =====================================================
   ELEMENTOS
===================================================== */

const target =
document.getElementById(
    "target"
);

const speaker =
document.getElementById(
    "speaker"
);

const answers =
document.getElementById(
    "answers"
);

const projectile =
document.getElementById(
    "projectile"
);

const game =
document.querySelector(
    ".game"
);

const video =
document.getElementById(
    "backgroundVideo"
);


/* =====================================================
   AUDIO
===================================================== */

function speakEnglish(word){

    if(
        !(
            "speechSynthesis"
            in window
        )
    ){

        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
    new SpeechSynthesisUtterance(
        word
    );


    utterance.lang =
    "en-US";


    utterance.rate =
    0.78;


    utterance.pitch =
    1;


    const voices =
    window.speechSynthesis
    .getVoices();


    const englishVoice =
    voices.find(
        voice =>
        voice.lang &&
        voice.lang
        .toLowerCase()
        .startsWith("en")
    );


    if(
        englishVoice
    ){

        utterance.voice =
        englishVoice;

    }


    window.speechSynthesis.speak(
        utterance
    );

}


if(
    "speechSynthesis"
    in window
){

    window.speechSynthesis
    .getVoices();

}


/* =====================================================
   BOTÓN DE AUDIO
===================================================== */

speaker.addEventListener(
    "click",
    function(){

        const current =
        rounds[
            round %
            rounds.length
        ];


        speakEnglish(
            current.en
        );

    }
);


/* =====================================================
   BUSCAR POSICIÓN SEGURA
===================================================== */

function findSafePosition(
    width,
    height
){

    /*
       RADIO REAL:

       La burbuja mide 70 px.
       Radio = 35 px.

       Dejamos unos píxeles extra
       de seguridad.
    */

    const radius = 40;


    const minX =
    radius;


    const maxX =
    width -
    radius;


    const minY =
    radius;


    const maxY =
    height -
    radius;


    for(
        let attempt = 0;
        attempt < 300;
        attempt++
    ){

        const x =
        minX +
        Math.random()
        *
        (
            maxX -
            minX
        );


        const y =
        minY +
        Math.random()
        *
        (
            maxY -
            minY
        );


        let safe =
        true;


        for(
            const b
            of bubbles
        ){

            const dx =
            x -
            b.x;


            const dy =
            y -
            b.y;


            const d =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


            /*
               82 px de separación.
            */

            if(
                d < 82
            ){

                safe =
                false;

                break;
            }

        }


        if(
            safe
        ){

            return {
                x:x,
                y:y
            };

        }

    }


    /*
       Posición alternativa.
    */

    return {

        x:
        Math.max(
            radius,
            Math.min(
                width -
                radius,
                width / 2
            )
        ),

        y:
        Math.max(
            radius,
            Math.min(
                height -
                radius,
                height / 2
            )
        )

    };

}


/* =====================================================
   CREAR RONDA
===================================================== */

function render(){

    const current =
    rounds[
        round %
        rounds.length
    ];


    /*
       Palabra española.
    */

    document.getElementById(
        "target"
    ).firstChild.textContent =
    current.es;


    answers.innerHTML =
    "";


    bubbles = [];


    /*
       Mezclar palabras.
    */

    const options =
    [...current.opts]
    .sort(
        () =>
        Math.random() -
        .5
    );


    /*
       Tamaño real de la zona.
    */

    const width =
    answers.clientWidth;


    const height =
    answers.clientHeight;


    options.forEach(
        word => {

            const bubble =
            document.createElement(
                "button"
            );


            bubble.className =
            "answer";


            /*
               SIEMPRE INGLÉS.
            */

            bubble.textContent =
            word;


            /*
               Encontrar posición.
            */

            const pos =
            findSafePosition(
                width,
                height
            );


            /*
               Movimiento aleatorio.
            */

            const angle =
            Math.random()
            *
            Math.PI
            *
            2;


            const speed =
            0.035 +
            Math.random()
            *
            0.025;


            const bubbleData = {

                element:
                bubble,

                /*
                   x/y = CENTRO
                */

                x:
                pos.x,

                y:
                pos.y,

                vx:
                Math.cos(angle)
                *
                speed,

                vy:
                Math.sin(angle)
                *
                speed,

                radius:
                35,

                frozen:
                false

            };


            bubbles.push(
                bubbleData
            );


            /*
               CORRECCIÓN IMPORTANTE:

               left/top = CENTRO
            */

            bubble.style.left =
            pos.x +
            "px";


            bubble.style.top =
            pos.y +
            "px";


            bubble.addEventListener(
                "click",
                function(){

                    shoot(
                        bubble,
                        word,
                        current.en
                    );

                }
            );


            answers.appendChild(
                bubble
            );

        }
    );

}


/* =====================================================
   ANIMACIÓN
===================================================== */

function animate(now){

    const delta =
    Math.min(
        now -
        lastTime,
        35
    );


    lastTime =
    now;


    if(
        !paused
    ){

        const factor =
        delta /
        16.67;


        const width =
        answers.clientWidth;


        const height =
        answers.clientHeight;


        /* ---------------------------------------------
           MOVER
        --------------------------------------------- */

        for(
            const b
            of bubbles
        ){

            if(
                b.frozen
            )
            continue;


            b.x +=
            b.vx *
            factor;


            b.y +=
            b.vy *
            factor;


            /*
               BARRERA IZQUIERDA
            */

            if(
                b.x -
                b.radius
                < 0
            ){

                b.x =
                b.radius;

                b.vx =
                Math.abs(
                    b.vx
                );

            }


            /*
               BARRERA DERECHA
            */

            if(
                b.x +
                b.radius
                > width
            ){

                b.x =
                width -
                b.radius;

                b.vx =
                -Math.abs(
                    b.vx
                );

            }


            /*
               BARRERA ARRIBA
            */

            if(
                b.y -
                b.radius
                < 0
            ){

                b.y =
                b.radius;

                b.vy =
                Math.abs(
                    b.vy
                );

            }


            /*
               BARRERA ABAJO
            */

            if(
                b.y +
                b.radius
                > height
            ){

                b.y =
                height -
                b.radius;

                b.vy =
                -Math.abs(
                    b.vy
                );

            }

        }


        /* ---------------------------------------------
           EVITAR CHOQUES
        --------------------------------------------- */

        for(
            let i = 0;
            i < bubbles.length;
            i++
        ){

            for(
                let j = i + 1;
                j < bubbles.length;
                j++
            ){

                const a =
                bubbles[i];


                const b =
                bubbles[j];


                if(
                    a.frozen ||
                    b.frozen
                )
                continue;


                const dx =
                b.x -
                a.x;


                const dy =
                b.y -
                a.y;


                const d =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


                /*
                   Separación mínima.
                */

                const minDistance =
                82;


                if(
                    d <
                    minDistance
                ){

                    const safeD =
                    d ||
                    0.01;


                    const nx =
                    dx /
                    safeD;


                    const ny =
                    dy /
                    safeD;


                    const push =
                    (
                        minDistance -
                        safeD
                    ) /
                    2;


                    a.x -=
                    nx *
                    push;


                    a.y -=
                    ny *
                    push;


                    b.x +=
                    nx *
                    push;


                    b.y +=
                    ny *
                    push;


                    /*
                       Rebote.
                    */

                    const oldVX =
                    a.vx;


                    const oldVY =
                    a.vy;


                    a.vx =
                    b.vx;


                    a.vy =
                    b.vy;


                    b.vx =
                    oldVX;


                    b.vy =
                    oldVY;

                }

            }

        }


        /* ---------------------------------------------
           APLICAR POSICIONES
        --------------------------------------------- */

        for(
            const b
            of bubbles
        ){

            /*
               SEGURIDAD EXTRA.

               Nunca permitir que el
               centro quede fuera.
            */

            b.x =
            Math.max(
                b.radius,
                Math.min(
                    width -
                    b.radius,
                    b.x
                )
            );


            b.y =
            Math.max(
                b.radius,
                Math.min(
                    height -
                    b.radius,
                    b.y
                )
            );


            b.element.style.left =
            b.x +
            "px";


            b.element.style.top =
            b.y +
            "px";

        }

    }


    requestAnimationFrame(
        animate
    );

}


/* =====================================================
   DISPARAR
===================================================== */

function shoot(
    bubble,
    word,
    correctWord
){

    if(
        paused ||
        shooting
    )
    return;


    shooting =
    true;


    const data =
    bubbles.find(
        b =>
        b.element ===
        bubble
    );


    if(
        data
    ){

        data.frozen =
        true;

    }


    const bubbleRect =
    bubble.getBoundingClientRect();


    const gameRect =
    game.getBoundingClientRect();


    /*
       CENTRO DE LA BURBUJA
    */

    const targetX =
    bubbleRect.left +
    bubbleRect.width / 2 -
    gameRect.left;


    const targetY =
    bubbleRect.top +
    bubbleRect.height / 2 -
    gameRect.top;


    /*
       TANQUE
    */

    const startX =
    gameRect.width / 2;


    const startY =
    gameRect.height -
    120;


    projectile.style.display =
    "block";


    projectile.style.left =
    startX +
    "px";


    projectile.style.top =
    startY +
    "px";


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    projectile.style.left =
                    targetX +
                    "px";


                    projectile.style.top =
                    targetY +
                    "px";

                }
            );

        }
    );


    setTimeout(
        () => {

            projectile.style.display =
            "none";


            /*
               EXPLOSIÓN
            */

            const explosion =
            document.createElement(
                "div"
            );


            explosion.className =
            "explosion";


            explosion.style.left =
            targetX +
            "px";


            explosion.style.top =
            targetY +
            "px";


            game.appendChild(
                explosion
            );


            setTimeout(
                () =>
                explosion.remove(),
                400
            );


            /*
               CORRECTA
            */

            if(
                word ===
                correctWord
            ){

                bubble.classList.add(
                    "correct"
                );


                score++;


                document.getElementById(
                    "score"
                ).textContent =
                score;


                /*
                   AUDIO
                */

                speakEnglish(
                    word
                );


                setTimeout(
                    () => {

                        round++;

                        shooting =
                        false;

                        render();

                    },
                    750
                );

            }


            /*
               INCORRECTA
            */

            else{

                bubble.classList.add(
                    "wrong"
                );


                errors++;


                document.getElementById(
                    "errors"
                ).textContent =
                errors;


                setTimeout(
                    () => {

                        bubble.classList.remove(
                            "wrong"
                        );


                        if(
                            data
                        ){

                            data.frozen =
                            false;


                            const angle =
                            Math.random()
                            *
                            Math.PI
                            *
                            2;


                            const speed =
                            0.035 +
                            Math.random()
                            *
                            0.025;


                            data.vx =
                            Math.cos(angle)
                            *
                            speed;


                            data.vy =
                            Math.sin(angle)
                            *
                            speed;

                        }


                        shooting =
                        false;

                    },
                    500
                );

            }

        },
        480
    );

}


/* =====================================================
   PAUSA
===================================================== */

document.getElementById(
    "pause"
).addEventListener(
    "click",
    function(){

        paused =
        !paused;


        this.textContent =
        paused
        ? "▶"
        : "Ⅱ";


        if(
            paused
        ){

            video.pause();

        }
        else{

            video.play()
            .catch(
                () => {}
            );

        }

    }
);


/* =====================================================
   ATRÁS
===================================================== */

document.getElementById(
    "backButton"
).addEventListener(
    "click",
    function(){

        if(
            history.length > 1
        ){

            history.back();

        }

    }
);


/* =====================================================
   INICIO
===================================================== */

let gameStarted =
false;


function startGame(){

    if(
        gameStarted
    )
    return;


    gameStarted =
    true;


    render();


    requestAnimationFrame(
        animate
    );

}


window.addEventListener(
    "load",
    () => {

        setTimeout(
            startGame,
            150
        );

    }
);

</script>
